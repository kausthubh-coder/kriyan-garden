name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check release version
        working-directory: packages/cli
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `cli-v${version}`) { console.error("The tag must match the CLI package version."); process.exit(1); }'
      - run: bun run typecheck
        working-directory: packages/cli
      - run: bun run lint
        working-directory: packages/cli
      - run: bun test
        working-directory: packages/cli
      - run: bun run build
        working-directory: packages/cli
      - run: node dist/kriyan.js --help
        working-directory: packages/cli
      - run: npm publish --access public --ignore-scripts
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
